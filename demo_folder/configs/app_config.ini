# Changes here are monitored by the File Integrity Monitor.

[server]
host = 127.0.0.1
port = 8080
debug = false
max_connections = 100

[database]
host = localhost
port = 5432
name = fim_db
user = fim_user
password = s3cur3p@ssw0rd!

[logging]
level = INFO
log_file = /var/log/fim/app.log
max_size_mb = 50
backup_count = 5

[security]
enable_tls = true
cert_file = /etc/ssl/certs/fim.crt
key_file  = /etc/ssl/private/fim.key
allowed_ips = 127.0.0.1, 192.168.1.0/24
